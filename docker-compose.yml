services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: minigames:${APP_VERSION}
    pull_policy: missing
    container_name: minigames-bogdanovych-org
    restart: always
    env_file:
      - src/assets/.env
    ports:
      - "8005:8000"

  cloudflared:
#    image: cloudflare/cloudflared:latest
    image: cloudflare/cloudflared:2026.7.3
    container_name: minigames-bogdanovych-org-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE__TUNNEL_TOKEN}
    depends_on:
      - web
